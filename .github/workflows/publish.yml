name: Pubblica identità e revoche

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish.mjs
      - name: Commit
        run: |
          git config user.name "vidi-publisher"
          git config user.email "vidi-publisher@users.noreply.github.com"
          # one folder at a time: a missing folder must not stop the others from being added
          for d in org status .well-known; do if [ -e "$d" ]; then git add -A -- "$d"; fi; done
          if git diff --cached --quiet; then echo "nessuna modifica"; else git commit -m "Aggiorna identità e revoche" && git push; fi
      # what is online must match the database: a difference fails the run (email to the owner)
      - name: Controllo di coerenza
        run: node scripts/check.mjs
